
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookmarked Events | XU EventHub</title>

    <!-- Shared and page-specific styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/bookmarked-events.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="bookmarked-events-app">

        <!-- Top Navigation -->
        <header class="bookmarked-events-header">

            <button class="back-button" type="button" aria-label="Go back">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="event-search">
                <p>Search for Events</p>
            </div>

        </header>


        <!-- Main Bookmarked Events Content -->
        <main class="bookmarked-events-content">

            <h1>Bookmarked Events</h1>


            <!-- Primary Events -->
            <section class="bookmarked-section">

                <h2>Primary Events</h2>

                <div class="bookmarked-primary-list" id="bookmarked-primary-list">

                    <!-- Primary event banners will be displayed here -->

                </div>

                <button class="show-all-button primary-show-all" type="button">
                    Show all <i class="fa-solid fa-chevron-down"></i>
                </button>

            </section>


            <!-- Secondary Events -->
            <section class="bookmarked-section">

                <h2>Secondary Events</h2>

                <div class="bookmarked-secondary-list" id="bookmarked-secondary-list">

                    <!-- Secondary event cards will be displayed here -->

                </div>

                <button class="show-all-button secondary-show-all" type="button">
                    Show all <i class="fa-solid fa-chevron-down"></i>
                </button>

            </section>

        </main>

    </div>

    <script src="js/bookmarked-events.js"></script>

</body>
</html>
